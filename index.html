<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🎉 NYE Jeopardy 🎉</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- Teams sidebar -->
  <aside id="teams">
    <h2>Teams</h2>
    <div id="teamsList"></div>
    <button id="addTeamButton">+ Add Team</button>
  </aside>

  <!-- Main board -->
  <main id="main">
    <header>
      <h1>🎉 NYE Jeopardy 🎉</h1>
      <div id="countdown"></div>
    </header>

    <div id="jeopardyBoard"></div>
  </main>

</div>

<!-- Question Modal -->
<div id="questionModal" class="hidden">
  <div class="modal-content">
    <div id="questionText"></div>
    <button id="revealButton">Show Answer</button>
    <div id="answerText" class="hidden"></div>
    <button id="closeButton" class="hidden">Close</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
